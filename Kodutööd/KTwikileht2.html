<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`SELECT ?isik2 ?isik2Label ?raamat ?raamatLabel WHERE {
  ?raamat wdt:P527 wd:Q465356.
  ?raamat wdt:P527 ?isik2.
  SERVICE wikibase:label { bd:serviceParam wikibase:language "et,en". }
}`;
           console.log(lause);
           // Kasutame encodeURIComponent, et SPARQL päring edastataks korrektselt
           let aadress="https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(lause);  
           
           let vastus = document.getElementById("vastus");
           vastus.innerHTML = "ootan vastust...";
           
           fetch(aadress)
              .then(d => d.json())
              .then(kuva)
              .catch(err => {
                 vastus.innerHTML = "Viga päringu sooritamisel.";
                 console.error(err);
              });
        }

        function kuva(d){
           console.log(d);
           let vastus = document.getElementById("vastus");
           vastus.innerHTML = "";
           
           for(let rida of d["results"]["bindings"]){
              // Parandatud: rida["isikLabel"] asemel on nüüd rida["isik2Label"]
              if(rida["isik2Label"]) {
                 console.log(rida["isik2Label"]["value"]);
                 let lause = document.createElement("li");
                 lause.textContent = rida["isik2Label"]["value"];
                 vastus.appendChild(lause);
              }
           }
        }
     </script>
  </head>
  <body>

     <input type="button" value="Pseudonüüm" onclick="kysi()" />
 
     <ul id="vastus"></ul>
    
         <!-- IFRAME ON SIIN: Otse body sees, mitte JavaScripti tsüklis -->
     <iframe style="width: 80vw; height: 50vh; border: none; display: block; margin-top: 20px;" 
             src="https://query.wikidata.org/sparql?query=%23defaultView%3AGraph%0ASELECT%20%3Fisik2%20%3Fisik2Label%20%3Fraamat%20%3FraamatLabel%20WHERE%7B%0A%20%20%3Fraamat%20wdt%3AP527%20wd%3AQ465356.%0A%20%20%3Fraamat%20wdt%3AP527%20%3Fisik2%0A%20%20%20%20SERVICE%20wikibase%3Alabel%20%7B%20bd%3AserviceParam%20wikibase%3Alanguage%20%22et%2Cen%22.%20%7D%0A%7D%0A%0A%0A" 
             referrerpolicy="origin" 
             sandbox="allow-scripts allow-same-origin allow-popups">
     </iframe>
  </body>
</html>
