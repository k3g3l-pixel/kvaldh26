<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`SELECT ?isik2 ?isik2Label ?raamat ?raamatLabel WHERE{
  ?raamat wdt:P527 wd:Q465356.
  ?raamat wdt:P527 ?isik2
    SERVICE wikibase:label { bd:serviceParam wikibase:language "et,en". }
}
           `;
           console.log(lause);
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);  
           vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva);
        }


       
        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["isikLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["isikLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
  </head>
  <body>
     <select id="pseudonüüm" onchange="kysi()">
     </select>

     <input type="button" value="otsi" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
