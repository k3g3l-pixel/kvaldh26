<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`SELECT ?isik2 ?isik2Label ?raamat ?raamatLabel WHERE {
  ?raamat wdt:P527 wd:Q465356.
  ?raamat wdt:P527 ?isik2.
  SERVICE wikibase:label { bd:serviceParam wikibase:language "et,en". }
}`;
           console.log(lause);
           // Kasutame encodeURIComponent, et SPARQL päring edastataks korrektselt
           let aadress="https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(lause);  
           
           let vastus = document.getElementById("vastus");
           vastus.innerHTML = "ootan vastust...";
           
           fetch(aadress)
              .then(d => d.json())
              .then(kuva)
              .catch(err => {
                 vastus.innerHTML = "Viga päringu sooritamisel.";
                 console.error(err);
              });
        }

        function kuva(d){
           console.log(d);
           let vastus = document.getElementById("vastus");
           vastus.innerHTML = "";
           
           for(let rida of d["results"]["bindings"]){
              // Parandatud: rida["isikLabel"] asemel on nüüd rida["isik2Label"]
              if(rida["isik2Label"]) {
                 console.log(rida["isik2Label"]["value"]);
                 let lause = document.createElement("li");
                 lause.textContent = rida["isik2Label"]["value"];
                 vastus.appendChild(lause);
              }
           }
        }
     </script>
  </head>
  <body>

     <input type="button" value="Pseudonüüm" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
