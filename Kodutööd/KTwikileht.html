<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`SELECT ?asi ?asiLabel ?pilt {
                ?asi wdt:P279 wd:${alamklass.value};
                wdt:P18 ?pilt.
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "et,en".
                } 
              
              } 

              LIMIT 5
           `;
           console.log(lause);
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);  
           vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva);
        }

         function kuva(d){
       console.log(d);
       vastus.innerHTML="";

       for(let rida of d["results"]["bindings"]){

          let item = document.createElement("li");

          let nimi = document.createElement("p");
          nimi.textContent = rida["asiLabel"]["value"];
          item.appendChild(nimi);

          if (rida["pilt"]) {
             let pilt = document.createElement("img");
             pilt.src = rida["pilt"]["value"];
             pilt.alt = rida["asiLabel"]["value"];
             pilt.width = 200;

             item.appendChild(pilt);
          }
          vastus.appendChild(item);
       }
    }
     </script>
  </head>
  <body>
     <select id="alamklass" onchange="kysi()">
        <option value="Q132911">Liftid</option>
        <option value="Q146">Kassid</option>
        <option value="Q886167">Lilled</option>
     </select>
     <input type="button" value="otsi" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
