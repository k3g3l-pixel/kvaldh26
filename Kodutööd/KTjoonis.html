
<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Hirvede maailm</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f1e8;
      text-align: center;
      margin: 20px;
    }

    .vorm {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ccc;
    }

    .vorm input {
      display: block;
      width: 90%;
      padding: 10px;
      margin: 10px auto;
      box-sizing: border-box;
    }

    button {
      background: #587b3c;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #3e5e29;
    }

    button:disabled {
      background: gray;
      cursor: wait;
    }

    canvas {
      background: white;
      border: 1px solid gray;
      max-width: 100%;
      height: auto;
    }

    #olek {
      font-weight: bold;
    }
  </style>

  <script>
    const url = "https://script.google.com/macros/s/AKfycbwjOwpQSiH0DTf1r1FzILQWTCe-6cdB2Xh22wRPV8lUPO5n6MIP9TcqYonkmAu_rdHvlw/exec";

    let g;
    let hirvedeAndmed = [];

    function hirv(x, y, sisalikud, linnud, loomad, kuupaev) {

      let jalad = 40 + sisalikud / 800 * 60;
      let keha = 0.7 + linnud / 800 * 0.7;
      let sarved = 25 + loomad / 100 * 0.5;

      g.save();
      g.translate(x - 200, y - 55);

      // Kuupäev
      g.fillStyle = "black";
      g.font = "18px Arial";
      g.fillText(kuupaev, 220, 75);

      // Jalad
      g.strokeStyle = "brown";
      g.lineWidth = 10;

      g.beginPath();
      g.moveTo(220, 240);
      g.lineTo(220, 240 + jalad);
      g.moveTo(300, 240);
      g.lineTo(300, 240 + jalad);
      g.stroke();

      // Keha
      g.fillStyle = "saddlebrown";
      g.beginPath();
      g.ellipse(260, 220, 65 * keha, 38 * keha, 0, 0, 2 * Math.PI);
      g.fill();

      // Kael
      g.beginPath();
      g.ellipse(340, 190, 22, 48, -0.5, 0, 2 * Math.PI);
      g.fill();

      // Pea
      g.beginPath();
      g.ellipse(375, 145, 30, 23, 0, 0, 2 * Math.PI);
      g.fill();

      // Nina
      g.fillStyle = "black";
      g.beginPath();
      g.arc(400, 150, 6, 0, 2 * Math.PI);
      g.fill();

      // Kõrvad
      g.fillStyle = "saddlebrown";
      g.beginPath();
      g.ellipse(350, 130, 18, 7, -0.5, 0, 2 * Math.PI);
      g.fill();

      // Sarved
      g.strokeStyle = "saddlebrown";
      g.lineWidth = 5;

      g.beginPath();

      g.moveTo(365, 128);
      g.lineTo(350, 128 - sarved);
      g.lineTo(335, 115 - sarved);

      g.moveTo(350, 128 - sarved);
      g.lineTo(360, 95 - sarved);

      g.moveTo(385, 125);
      g.lineTo(400, 125 - sarved);
      g.lineTo(415, 110 - sarved);

      g.moveTo(400, 125 - sarved);
      g.lineTo(390, 90 - sarved);

      g.stroke();

      // Silm
      g.fillStyle = "black";
      g.beginPath();
      g.arc(375, 140, 3, 0, 2 * Math.PI);
      g.fill();

      g.restore();
    }

    function joonista() {

      let tahvel = document.getElementById("tahvel");
      g = tahvel.getContext("2d");

      let veerge = 3;
      let laius = 250;
      let korgus = 310;

      let ridu = Math.ceil(hirvedeAndmed.length / veerge);

      tahvel.width = veerge * laius;
      tahvel.height = Math.max(1, ridu) * korgus;

      g.clearRect(0, 0, tahvel.width, tahvel.height);

      for (let i = 0; i < hirvedeAndmed.length; i++) {

        let d = hirvedeAndmed[i];

        let x = (i % veerge) * laius;
        let y = Math.floor(i / veerge) * korgus;

        hirv(
          x, y,
          Number(d[1]),
          Number(d[2]),
          Number(d[3]),
          d[0]
        );
      }

      document.getElementById("arv").innerText =
        "Hirvede arv: " + hirvedeAndmed.length;
    }

    function uuendaAndmed() {

      document.getElementById("olek").innerText =
        "Laen andmeid...";

      fetch(url)
        .then(d => {
          if (!d.ok) throw new Error("Andmete lugemine ebaõnnestus");
          return d.json();
        })
        .then(andmed => {
          loe(andmed);
          document.getElementById("olek").innerText =
            "Andmed laaditud!";
        })
        .catch(viga => {
          document.getElementById("olek").innerText =
            "Viga andmete lugemisel: " + viga.message;
        });
    }

    function loe(andmed) {
      hirvedeAndmed = andmed;
      joonista();
    }

    function lisaHirv() {

      let kuupaev = document.getElementById("kuupaev").value;
      let sisalikud = Number(document.getElementById("sisalikud").value);
      let linnud = Number(document.getElementById("linnud").value);
      let loomad = Number(document.getElementById("loomad").value);

      if (!kuupaev ||
          document.getElementById("sisalikud").value === "" ||
          document.getElementById("linnud").value === "" ||
          document.getElementById("loomad").value === "" ||
          ![sisalikud, linnud, loomad].every(n => Number.isFinite(n) && n >= 0)) {

        alert("Palun täida kõik väljad korrektsete arvudega!");
        return;
      }

      const nupp = document.getElementById("lisaNupp");

      nupp.disabled = true;

      let uusHirv = {
        kuupaev: kuupaev,
        sisalikud: sisalikud,
        linnud: linnud,
        loomad: loomad
      };

      hirvedeAndmed.push([
        uusHirv.kuupaev,
        uusHirv.sisalikud,
        uusHirv.linnud,
        uusHirv.loomad
      ]);

      joonista();

      document.getElementById("olek").innerText =
        "Hirv lisatud ekraanile. Saadan andmeid tabelisse...";

      fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(uusHirv)
      })
      .then(() => {
        document.getElementById("olek").innerText =
          "Hirv lisatud! Salvestuspäring saadetud Google Sheetsile.";
      })
      .catch(viga => {
        document.getElementById("olek").innerText =
          "Hirv on ekraanil, kuid saatmisel tekkis võrguviga!";
        console.log(viga);
      })
      .finally(() => {
        nupp.disabled = false;
      });

      document.getElementById("sisalikud").value = "";
      document.getElementById("linnud").value = "";
      document.getElementById("loomad").value = "";
    }

  </script>
</head>

<body onload="uuendaAndmed()">

  <h1>Hirved</h1>

  <div class="vorm">

    <h2>Lisa uus hirv</h2>

    <label>Kuupäev:</label>
    <input type="date" id="kuupaev">

    <label>Jala pikkus:</label>
    <input type="number" id="sisalikud" min="0" placeholder="Sisalikute arv">

    <label>Keha suurus:</label>
    <input type="number" id="linnud" min="0" placeholder="Lindude arv">

    <label>Sarvede uhkus:</label>
    <input type="number" id="loomad" min="0" placeholder="Loomade arv">

    <button id="lisaNupp" onclick="lisaHirv()">
      Lisa hirv
    </button>

    <p id="olek">Laen andmeid...</p>

  </div>

  <h2 id="arv">Hirvede arv: 0</h2>

  <canvas id="tahvel" width="750" height="310">
  </canvas>

  <br><br>

  <button onclick="uuendaAndmed()">
    Uuenda andmeid tabelist
  </button>

</body>
</html>
