
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hirved</title>

  <script>
    let g;
    let hirvedeAndmed = [];

    // Hirve joonistamine andmete põhjal
    function hirv(x, y, sisalikud, linnud, loomad, kuupaev) {

      // Hirve mõõtmed
      let jalad = 40 + sisalikud / 800 * 60;
      let keha = 0.7 + linnud / 800 * 0.7;
      let sarved = 25 + loomad / 100 * 0.5;

      g.save();

      // Hirve asukoht
      g.translate(x - 200, y - 55);

      // Kuupäev
      g.fillStyle = "black";
      g.font = "18px Arial";
      g.textAlign = "left";
      g.fillText(kuupaev, 220, 75);

      // Jalad
      g.strokeStyle = "brown";
      g.lineWidth = 10;

      g.beginPath();
      g.moveTo(220, 240);
      g.lineTo(220, 240 + jalad);

      g.moveTo(300, 240);
      g.lineTo(300, 240 + jalad);
      g.stroke();

      // Keha
      g.fillStyle = "saddlebrown";
      g.beginPath();
      g.ellipse(260, 220, 65 * keha, 38 * keha, 0, 0, 2 * Math.PI);
      g.fill();

      // Kael
      g.beginPath();
      g.ellipse(340, 190, 22, 48, -0.5, 0, 2 * Math.PI);
      g.fill();

      // Pea
      g.beginPath();
      g.ellipse(375, 145, 30, 23, 0, 0, 2 * Math.PI);
      g.fill();

      // Nina
      g.fillStyle = "black";
      g.beginPath();
      g.arc(400, 150, 6, 0, 2 * Math.PI);
      g.fill();

      // Kõrvad
      g.fillStyle = "saddlebrown";
      g.beginPath();
      g.ellipse(350, 130, 18, 7, -0.5, 0, 2 * Math.PI);
      g.fill();

      // Sarved
      g.strokeStyle = "saddlebrown";
      g.lineWidth = 5;

      g.beginPath();

      // Vasak sarv
      g.moveTo(365, 128);
      g.lineTo(350, 128 - sarved);
      g.lineTo(335, 115 - sarved);

      g.moveTo(350, 128 - sarved);
      g.lineTo(360, 95 - sarved);

      // Parem sarv
      g.moveTo(385, 125);
      g.lineTo(400, 125 - sarved);
      g.lineTo(415, 110 - sarved);

      g.moveTo(400, 125 - sarved);
      g.lineTo(390, 90 - sarved);

      g.stroke();

      // Silm
      g.fillStyle = "black";
      g.beginPath();
      g.arc(375, 140, 3, 0, 2 * Math.PI);
      g.fill();

      g.restore();
    }


    // Kõikide hirvede joonistamine
    function joonista() {

      let tahvel = document.getElementById("tahvel");
      g = tahvel.getContext("2d");

      let veerge = 3;
      let laius = 250;
      let korgus = 310;

      let ridu = Math.ceil(hirvedeAndmed.length / veerge);

      tahvel.width = veerge * laius;
      tahvel.height = Math.max(1, ridu) * korgus;

      g.clearRect(0, 0, tahvel.width, tahvel.height);

      // Joonistame iga andmerea põhjal ühe hirve
      for (let i = 0; i < hirvedeAndmed.length; i++) {

        let d = hirvedeAndmed[i];

        let x = (i % veerge) * laius;
        let y = Math.floor(i / veerge) * korgus;

        hirv(
          x,
          y,
          Number(d[1]),
          Number(d[2]),
          Number(d[3]),
          d[0]
        );
      }

      document.getElementById("olek").innerText =
        "Kuvatud hirvede arv: " + hirvedeAndmed.length;
    }


    // Andmete uuendamine Google Sheetsist
    function uuendaAndmed() {

      document.getElementById("olek").innerText =
        "Laen andmeid...";

      fetch("https://script.google.com/macros/s/AKfycbzUsdk8wrT0yeMSqXuXi4E8IJMbC4PVuVqT3GzTOANbrWoiup9MRu9jM9Q356wiC7iSew/exec")
        .then(d => {
          if (!d.ok) {
            throw new Error("Andmete päring ebaõnnestus!");
          }
          return d.json();
        })
        .then(loe)
        .catch(viga => {
          document.getElementById("olek").innerText =
            "Andmete laadimine ebaõnnestus: " + viga.message;
          console.log(viga);
        });
    }


    // Andmete salvestamine ja joonistamine
    function loe(andmed) {

      hirvedeAndmed = andmed;

      joonista();
    }

  </script>

  <style>
    body {
      font-family: Arial;
      background-color: #f5f1e8;
      text-align: center;
    }

    canvas {
      background-color: white;
      border: 1px solid gray;
      max-width: 100%;
      height: auto;
    }

    input {
      padding: 8px 20px;
      margin: 10px;
      cursor: pointer;
    }
  </style>

</head>

<body onload="uuendaAndmed()">

  <h1>Hirvede maailm</h1>

  <p id="olek">Andmete laadimine...</p>

  <canvas id="tahvel" width="750" height="310">
  </canvas>

  <br>

  <input type="button" value="Uuenda andmeid" onclick="uuendaAndmed()">

</body>
</html>
