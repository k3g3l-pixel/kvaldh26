
<!doctype html>
<html>
  <head>
    <title>Hirv</title>
    <script>
      async function joonista(){

        let g = tahvel.getContext("2d");

        // Andmete lugemine Google Sheetsist
        let url = "https://script.google.com/macros/s/AKfycbzUsdk8wrT0yeMSqXuXi4E8IJMbC4PVuVqT3GzTOANbrWoiup9MRu9jM9Q356wiC7iSew/exec";

        try {
          let vastus = await fetch(url);
          let tekst = await vastus.text();

          let read = tekst.trim().split("\n");

          // Viimane täidetud andmerida
          let andmed = read[read.length - 1].split(",");

          let kuupaev = andmed[0];
          let sisalikud = Number(andmed[1]);
          let linnud = Number(andmed[2]);
          let loomad = Number(andmed[3]);

          // Arvutame hirve mõõtmed
          let jalad = 40 + sisalikud / 800 * 60;
          let keha = 0.7 + linnud / 800 * 0.7;
          let sarved = 25 + loomad / 100 * 0.5;

          // Puhastame tahvli
          g.clearRect(0, 0, 600, 400);

          // Kuupäev
          g.fillStyle = "black";
          g.font = "20px Arial";
          g.fillText(kuupaev, 20, 30);

          // Jalad
          g.strokeStyle = "brown";
          g.lineWidth = 10;

          g.beginPath();
          g.moveTo(220, 240);
          g.lineTo(220, 240 + jalad);
          g.moveTo(300, 240);
          g.lineTo(300, 240 + jalad);
          g.stroke();

          // Keha
          g.fillStyle = "saddlebrown";
          g.beginPath();
          g.ellipse(260, 220, 65 * keha, 38 * keha, 0, 0, 2 * Math.PI);
          g.fill();

          // Kael
          g.beginPath();
          g.ellipse(340, 190, 22, 48, -0.5, 0, 2 * Math.PI);
          g.fill();

          // Pea
          g.beginPath();
          g.ellipse(375, 145, 30, 23, 0, 0, 2 * Math.PI);
          g.fill();

          // Nina
          g.fillStyle = "black";
          g.beginPath();
          g.arc(400, 150, 6, 0, 2 * Math.PI);
          g.fill();

          // Kõrvad
          g.fillStyle = "saddlebrown";
          g.beginPath();
          g.ellipse(350, 130, 18, 7, -0.5, 0, 2 * Math.PI);
          g.fill();

          // Sarved
          g.strokeStyle = "saddlebrown";
          g.lineWidth = 5;

          g.beginPath();

          // Vasak sarv
          g.moveTo(365, 128);
          g.lineTo(350, 128 - sarved);
          g.lineTo(335, 115 - sarved);
          g.moveTo(350, 128 - sarved);
          g.lineTo(360, 95 - sarved);

          // Parem sarv
          g.moveTo(385, 125);
          g.lineTo(400, 125 - sarved);
          g.lineTo(415, 110 - sarved);
          g.moveTo(400, 125 - sarved);
          g.lineTo(390, 90 - sarved);

          g.stroke();

          // Silm
          g.fillStyle = "black";
          g.beginPath();
          g.arc(375, 140, 3, 0, 2 * Math.PI);
          g.fill();

        }
        catch(viga) {
          g.fillStyle = "red";
          g.fillText("Andmete lugemine ebaõnnestus!", 20, 50);
          console.log(viga);
        }
      }
    </script>
  </head>

  <body onload="joonista()">
    <h1>Hirv</h1>

    <canvas id="tahvel" width="600" height="400">
    </canvas>
  </body>
</html>
